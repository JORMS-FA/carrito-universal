name: Compilar APK ShopWise

on:
  push:
    branches: [ main, master ] # Se ejecuta automáticamente al subir cambios a main o master
  workflow_dispatch: # Esto te permite activar la compilación manualmente desde un botón si quieres

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle' # Esto acelera las próximas compilaciones guardando la caché

    - name: Dar permisos de ejecución a Gradle
      run: chmod +x ./gradlew

    - name: Compilar APK de prueba (Debug)
      run: ./gradlew assembleDebug

    - name: Extraer y guardar el archivo APK
      uses: actions/upload-artifact@v4
      with:
        name: ShopWise-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        
