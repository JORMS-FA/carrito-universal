name: Compilar APK Debug (Dev)

on:
  push:
    branches: ["dev"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Create fallback env file
        run: |
          mkdir -p config
          if [ ! -f config/.env ]; then
            echo "GEMINI_API_KEY=dummy_value_for_workflow_compilation" > config/.env
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"
          cache-provider: basic
          cache-cleanup: never

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Upload debug APK as artifact
        uses: actions/upload-artifact@v7
        with:
          name: carrito-universal-dev-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK for repo commit
        run: |
          mkdir -p build-outputs/dev
          cp app/build/outputs/apk/debug/app-debug.apk build-outputs/dev/carrito-universal-dev.apk
          echo "APK compiled from commit: ${{ github.sha }}" > build-outputs/dev/VERSION.txt
          date -u >> build-outputs/dev/VERSION.txt

      - name: Commit APK to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-outputs/dev/
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🔨 APK Debug Dev [skip ci]" --allow-empty
            git push
          fi
